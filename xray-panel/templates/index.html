<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xray Panel | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
        .btn-primary { background-color: #3b82f6; transition: all 0.2s; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; transition: all 0.2s; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-success { background-color: #10b981; transition: all 0.2s; }
        .btn-success:hover { background-color: #059669; }
        .table-row:hover { background-color: #273549; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 50; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <nav class="flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold text-blue-400">⚡ Xray Management Panel</h1>
        <div class="text-sm text-slate-400">System Status: <span id="system-status" class="text-green-400 font-semibold">Online</span></div>
    </nav>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="card p-6 flex flex-col">
            <span class="text-slate-400 text-sm">Total Users</span>
            <span id="stat-total" class="text-3xl font-bold mt-2">0</span>
        </div>
        <div class="card p-6 flex flex-col">
            <span class="text-slate-400 text-sm">Active Connections</span>
            <span id="stat-active" class="text-3xl font-bold mt-2 text-green-400">0</span>
        </div>
        <div class="card p-6 flex flex-col">
            <span class="text-slate-400 text-sm">Total Traffic Used</span>
            <span id="stat-traffic" class="text-3xl font-bold mt-2 text-blue-400">0 GB</span>
        </div>
    </div>

    <div class="card p-6 mb-8">
        <h2 class="text-lg font-semibold mb-4">Add New User</h2>
        <form id="add-user-form" class="flex flex-col md:flex-row gap-4">
            <input type="text" id="username" placeholder="Username" required class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="number" id="quota" placeholder="Quota (GB, 0 for unlimited)" value="0" class="w-full md:w-48 bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" class="btn-primary text-white font-semibold px-6 py-2 rounded-lg">Add User</button>
        </form>
    </div>

    <div class="card overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-slate-800 border-b border-slate-700">
                    <tr>
                        <th class="px-6 py-3 text-xs font-medium text-slate-400 uppercase tracking-wider">User</th>
                        <th class="px-6 py-3 text-xs font-medium text-slate-400 uppercase tracking-wider">UUID</th>
                        <th class="px-6 py-3 text-xs font-medium text-slate-400 uppercase tracking-wider">Usage</th>
                        <th class="px-6 py-3 text-xs font-medium text-slate-400 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-xs font-medium text-slate-400 uppercase tracking-wider text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table-body" class="divide-y divide-slate-700">
                    <!-- JS ile doldurulacak -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="modal">
        <div class="card p-8 max-w-sm w-full mx-4 text-center relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl">&times;</button>
            <h3 id="modal-title" class="text-xl font-bold mb-6">Connection Details</h3>
            <div id="qrcode" class="flex justify-center mb-6"></div>
            <div class="flex flex-col gap-2">
                <button onclick="copyLink('vless')" class="btn-primary text-white py-2 rounded-lg">Copy VLESS Link</button>
                <button onclick="copyLink('vmess')" class="btn-success text-white py-2 rounded-lg">Copy VMess Link</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentUUID = '';
        let currentUsername = '';
        let serverConfig = {};

        async function fetchConfig() {
            try {
                const res = await fetch(`${API_BASE}/api/config`);
                serverConfig = await res.json();
            } catch (err) {
                console.error("Failed to fetch config", err);
            }
        }

        async function fetchUsers() {
            try {
                const res = await fetch(`${API_BASE}/api/users`);
                const users = await res.json();
                renderUsers(users);
                updateStats(users);
            } catch (err) {
                console.error("Failed to fetch users:", err);
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            if (bytes < 0) return 'Unlimited';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updateStats(users) {
            document.getElementById('stat-total').innerText = users.length;
            document.getElementById('stat-active').innerText = users.filter(u => u.is_active).length;
            const totalBytes = users.reduce((sum, u) => sum + u.used_bytes, 0);
            document.getElementById('stat-traffic').innerText = formatBytes(totalBytes);
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-slate-500">No users found. Add one above!</td></tr>';
                return;
            }

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.className = 'table-row';
                
                const quotaText = user.quota_bytes === 0 ? 'Unlimited' : formatBytes(user.quota_bytes);
                const usagePercent = user.quota_bytes > 0 ? Math.min((user.used_bytes / user.quota_bytes) * 100, 100) : 0;
                
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="font-medium text-white">${user.username}</div>
                        <div class="text-xs text-slate-400">Port: ${user.port}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-400 font-mono">${user.uuid.substring(0, 8)}...</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-white">${formatBytes(user.used_bytes)} <span class="text-slate-500">/ ${quotaText}</span></div>
                        <div class="w-full bg-slate-700 rounded-full h-1.5 mt-2">
                            <div class="bg-blue-500 h-1.5 rounded-full" style="width: ${usagePercent}%"></div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${user.is_active ? 'bg-green-900 text-green-200' : 'bg-red-900 text-red-200'}">
                            ${user.is_active ? 'Active' : 'Blocked'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                        <button onclick="showQR('${user.uuid}', '${user.username}')" class="text-blue-400 hover:text-blue-300">QR</button>
                        <button onclick="deleteUser(${user.id})" class="text-red-400 hover:text-red-300">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const quota = document.getElementById('quota').value;
            
            try {
                const res = await fetch(`${API_BASE}/api/users?username=${encodeURIComponent(username)}&quota_gb=${quota}`, {
                    method: 'POST'
                });
                if (res.ok) {
                    document.getElementById('add-user-form').reset();
                    fetchUsers();
                } else {
                    alert("Failed to add user");
                }
            } catch (err) {
                console.error(err);
            }
        });

        async function deleteUser(id) {
            if (!confirm("Are you sure you want to delete this user?")) return;
            try {
                await fetch(`${API_BASE}/api/users/${id}`, { method: 'DELETE' });
                fetchUsers();
            } catch (err) {
                console.error(err);
            }
        }

        function showQR(uuid, username) {
            currentUUID = uuid;
            currentUsername = username;
            
            document.getElementById('qrcode').innerHTML = '';
            const vlessLink = generateVLESSLink(uuid);
            
            new QRCode(document.getElementById("qrcode"), {
                text: vlessLink,
                width: 256,
                height: 256,
                colorDark: "#ffffff",
                colorLight: "#1e293b",
                correctLevel: QRCode.CorrectLevel.H
            });
            
            document.getElementById('modal-title').innerText = username;
            document.getElementById('qr-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('qr-modal').classList.remove('active');
        }

        function generateVLESSLink(uuid) {
            const params = new URLSearchParams({
                type: "tcp",
                security: "reality",
                pbk: serverConfig.public_key || "",
                sni: serverConfig.sni || "www.microsoft.com",
                fp: "chrome",
                sid: serverConfig.short_id || "",
                flow: "xtls-rprx-vision"
            });
            
            return `vless://${uuid}@${serverConfig.server_ip || window.location.hostname}:443?${params.toString()}#${encodeURIComponent(currentUsername)}`;
        }

        function generateVMessLink(uuid) {
            const config = {
                v: "2",
                ps: currentUsername,
                add: serverConfig.server_ip || window.location.hostname,
                port: "8080",
                id: uuid,
                aid: "0",
                net: "ws",
                type: "none",
                host: "",
                path: "/vmess",
                tls: ""
            };
            return "vmess://" + btoa(JSON.stringify(config));
        }

        function copyLink(type) {
            let link = "";
            if (type === 'vless') link = generateVLESSLink(currentUUID);
            if (type === 'vmess') link = generateVMessLink(currentUUID);
            
            navigator.clipboard.writeText(link).then(() => {
                alert("Link copied to clipboard!");
            });
        }

        // Sayfa yüklendiğinde konfigürasyonu ve kullanıcıları çek
        fetchConfig().then(() => fetchUsers());
    </script>
</body>
</html>
